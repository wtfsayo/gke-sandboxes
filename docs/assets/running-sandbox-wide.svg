<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" aria-labelledby="title desc" role="img" viewBox="0 0 720 420"><title id="title">Running sandbox costs</title><desc id="desc">Cost in US cents per hour a sandbox is awake. gke-sandboxes is the whole cluster bill divided by the sandbox-hours awake. Other prices are list compute rates for a 2 vCPU, 4 GB sandbox at Energy’s measured average load of 0.076 vCPU and 0.73 GiB. gke-sandboxes 1.9¢, 1×. Modal 3.5¢, 1.8×. Fly.io 9.2¢, 4.7×. Vercel Sandbox 9.5¢, 4.9×. Daytona 16.6¢, 8.5×. E2B 16.6¢, 8.5×. Managed prices exclude disks, plans, credits and discounts.</desc><rect width="719" height="419" x=".5" y=".5" fill="#fcfcfb" stroke="#d7ded9" rx="10"/><svg width="30" height="27" x="19" y="11" viewBox="112 120 726 600"><path fill="#000" d="M711.219604,648.383301 C686.333313,649.950073 661.891479,650.723816 637.440491,651.556519 C585.978760,653.308960 534.512268,653.389709 483.039429,653.412292 C451.067657,653.426331 419.093475,653.439453 387.124725,653.074585 C357.981903,652.742004 328.838867,652.099243 299.707428,651.214539 C278.594055,650.573242 257.467987,649.748291 236.404343,648.221863 C208.448395,646.195862 180.347900,645.064941 152.935806,638.341492 C146.448990,636.750488 140.112457,634.682190 134.440063,631.058899 C125.461250,625.323425 124.114792,617.375549 130.856140,609.142334 C137.215744,601.375366 145.850266,596.543884 154.424438,591.730408 C163.594681,586.582275 173.259155,582.515259 183.175385,579.025269 C184.996506,578.384338 187.110840,578.135010 188.421860,575.963501 C187.478119,573.643066 185.106232,573.053284 183.139145,572.032776 C166.417465,563.357117 149.999542,554.190613 135.001266,542.686279 C129.965042,538.823303 125.076302,534.824036 121.387253,529.566650 C116.868141,523.126465 117.615273,515.939880 123.699501,510.880035 C133.762466,502.511292 146.100677,499.482605 158.463699,496.704498 C169.265182,494.277313 180.276108,494.567719 191.259277,494.617157 C193.183487,494.625824 195.264603,